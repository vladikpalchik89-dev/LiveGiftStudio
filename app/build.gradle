
plugins {
    id 'com.android.application'
}

// Секреты не храним в репозитории: они приходят из переменных окружения
// (GitHub Actions secrets) или из ~/.gradle/gradle.properties.
def lgsSwitchKey = System.getenv("LGS_SWITCH_KEY") ?: project.findProperty("lgsSwitchKey") ?: ""
def lgsOrdersKey = System.getenv("LGS_ORDERS_KEY") ?: project.findProperty("lgsOrdersKey") ?: ""

android {
    namespace 'com.livegiftstudio'
    compileSdk 35

    defaultConfig {
        applicationId 'com.livegiftstudio'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.1'

        buildConfigField "String", "SWITCH_KEY", "\"${lgsSwitchKey}\""
        buildConfigField "String", "ORDERS_KEY", "\"${lgsOrdersKey}\""
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
