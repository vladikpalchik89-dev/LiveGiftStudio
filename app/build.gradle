
plugins {
    id 'com.android.application'
}

// Поля остаются только для совместимости со старыми сборками и локальной
// разработки. В CI секреты больше НЕ передаются: ключи вводятся в приложении
// и хранятся в SharedPreferences, а не в публичном APK.
def lgsSwitchKey = System.getenv("LGS_SWITCH_KEY") ?: project.findProperty("lgsSwitchKey") ?: ""
def lgsOrdersKey = System.getenv("LGS_ORDERS_KEY") ?: project.findProperty("lgsOrdersKey") ?: ""

android {
    namespace 'com.livegiftstudio'
    compileSdk 35

    defaultConfig {
        applicationId 'com.livegiftstudio'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.1'

        buildConfigField "String", "SWITCH_KEY", "\"${lgsSwitchKey}\""
        buildConfigField "String", "ORDERS_KEY", "\"${lgsOrdersKey}\""
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    testImplementation 'junit:junit:4.13.2'
}
