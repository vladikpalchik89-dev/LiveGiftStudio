name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Отменяем предыдущую сборку той же ветки, чтобы не жечь минуты Actions
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false

      - name: Build debug APK
        env:
          LGS_SWITCH_KEY: ${{ secrets.LGS_SWITCH_KEY }}
          LGS_ORDERS_KEY: ${{ secrets.LGS_ORDERS_KEY }}
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LiveGiftStudio-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # Публичная ссылка на APK: не нужен вход в GitHub,
      # файл просто скачивается по прямой ссылке.
      - name: Publish APK release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: LiveGiftStudio ${{ github.run_number }}
          body: Автоматическая сборка из main (${{ github.sha }})
          files: app/build/outputs/apk/debug/*.apk
          make_latest: true
